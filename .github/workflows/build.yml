name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AutoClicker/AutoClicker.sln
        working-directory: .

      - name: Build
        run: dotnet build AutoClicker/AutoClicker.sln --configuration Release --no-restore
        working-directory: .

      - name: Test
        run: dotnet test AutoClicker/AutoClicker.Tests/AutoClicker.Tests.csproj --configuration Release --no-build --verbosity normal
        working-directory: .
